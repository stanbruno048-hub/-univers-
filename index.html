<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Univers Chat</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial;background:#111b21;color:#e9edef;height:100vh;overflow:hidden}
    .screen{display:none;height:100vh;width:100%}
    .screen.active{display:flex}
    
    #welcomeScreen{justify-content:center;align-items:center;background:linear-gradient(135deg,#0c1317,#1f2c33);flex-direction:column;text-align:center;padding:20px}
    #welcomeScreen h1{font-size:36px;color:#25d366;margin-bottom:15px}
    #welcomeScreen p{font-size:16px;color:#8696a0;margin-bottom:40px}
    #btnStart{padding:15px 40px;background:#25d366;border:none;border-radius:50px;font-weight:600;font-size:18px;color:#111b21;cursor:pointer}
    
    #authScreen{justify-content:center;align-items:center;background:#0c1317}
    .auth-box{background:#1f2c33;padding:40px 30px;border-radius:16px;width:90%;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
    .auth-box h2{color:#e9edef;margin-bottom:8px;font-size:26px;text-align:center}
    .auth-box .subtitle{color:#8696a0;margin-bottom:25px;font-size:14px;text-align:center}
    .auth-box input{width:100%;padding:14px;margin-bottom:15px;background:#2a3942;border:1px solid #374045;border-radius:10px;color:#e9edef;font-size:16px;outline:none}
    .auth-box input:focus{border-color:#25d366}
    .auth-box button{width:100%;padding:15px;background:#25d366;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:16px;margin-top:5px}
    .auth-box .toggle{margin-top:15px;text-align:center;color:#8696a0;font-size:14px}
    .auth-box .toggle span{color:#25d366;cursor:pointer;font-weight:600}
    .auth-box .error{color:#f15c6d;font-size:13px;margin-bottom:12px;text-align:center;display:none}
    .auth-box .success{color:#25d366;font-size:13px;margin-bottom:12px;text-align:center;display:none}
    
    #accountScreen{flex-direction:column;background:#111b21}
    .account-header{background:#1f2c33;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a3942}
    .account-header h1{font-size:22px;color:#25d366}
    .account-header button{padding:8px 14px;background:#dc3545;border:none;border-radius:8px;color:white;cursor:pointer;font-size:14px;font-weight:600}
    .account-content{flex:1;display:flex;justify-content:center;align-items:center;padding:30px}
    .account-card{background:#1f2c33;padding:35px 30px;border-radius:16px;width:100%;max-width:500px;text-align:center}
    .account-card .avatar{width:80px;height:80px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111b21;font-size:36px;margin:0 auto 20px}
    .account-card h3{font-size:24px;color:#e9edef;margin-bottom:8px}
    .account-card p{font-size:15px;color:#8696a0;margin-bottom:30px}
    .account-card .info{background:#2a3942;padding:15px;border-radius:10px;margin-bottom:12px;text-align:left}
    .account-card .info-label{font-size:12px;color:#8696a0;margin-bottom:4px}
    .account-card .info-value{font-size:16px;color:#e9edef;font-weight:600}
  </style>
</head>
<body>
  <!-- ÉCRAN 1 : BIENVENUE -->
  <div id="welcomeScreen" class="screen active">
    <h1>Bienvenue sur Univers Chat</h1>
    <p>Discute en temps réel avec tes amis</p>
    <button id="btnStart">Commencer</button>
  </div>

  <!-- ÉCRAN 2 : CONNEXION / INSCRIPTION -->
  <div id="authScreen" class="screen">
    <div class="auth-box">
      <h2 id="authTitle">Se connecter</h2>
      <p class="subtitle" id="authSubtitle">Entre tes identifiants</p>
      
      <div class="error" id="authError"></div>
      <div class="success" id="authSuccess"></div>
      
      <input type="text" id="pseudoInput" placeholder="Pseudo" maxlength="20">
      <input type="tel" id="phoneInput" placeholder="Numéro de téléphone" maxlength="15">
      <input type="password" id="passwordInput" placeholder="Mot de passe" maxlength="30">
      
      <button id="btnAuth">Se connecter</button>
      
      <div class="toggle">
        <span id="toggleAuth">Pas encore de compte ? S'inscrire</span>
      </div>
    </div>
  </div>

  <!-- ÉCRAN 3 : COMPTE -->
  <div id="accountScreen" class="screen">
    <div class="account-header">
      <h1>Univers Chat</h1>
      <button id="btnLogout">Déconnexion</button>
    </div>
    <div class="account-content">
      <div class="account-card">
        <div class="avatar" id="userAvatar">U</div>
        <h3 id="userPseudo">Pseudo</h3>
        <p>Connecté avec succès</p>
        
        <div class="info">
          <div class="info-label">Pseudo</div>
          <div class="info-value" id="infoPseudo">-</div>
        </div>
        <div class="info">
          <div class="info-label">Numéro de téléphone</div>
          <div class="info-value" id="infoPhone">-</div>
        </div>
        <div class="info">
          <div class="info-label">Date de création</div>
          <div class="info-value" id="infoDate">-</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // COLLE TA CONFIG FIREBASE ICI
const firebaseConfig = {
  apiKey: "AIzaSyBDskOrlsXNEkcQlGO4jdC5LMPcWICEF04",
  authDomain: "univers-chat-a6303.firebaseapp.com",
  databaseURL: "https://univers-chat-a6303-default-rtdb.firebaseio.com",
  projectId: "univers-chat-a6303",
  storageBucket: "univers-chat-a6303.firebasestorage.app",
  messagingSenderId: "1019876595261",
  appId: "1:1019876595261:web:7c67c74bc1426b1ca2bc54"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let isLoginMode = true; // true = connexion, false = inscription
    let currentUser = null;

    // Éléments DOM
    const welcomeScreen = document.getElementById("welcomeScreen");
    const authScreen = document.getElementById("authScreen");
    const accountScreen = document.getElementById("accountScreen");
    const btnStart = document.getElementById("btnStart");
    const btnAuth = document.getElementById("btnAuth");
    const btnLogout = document.getElementById("btnLogout");
    const toggleAuth = document.getElementById("toggleAuth");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const pseudoInput = document.getElementById("pseudoInput");
    const phoneInput = document.getElementById("phoneInput");
    const passwordInput = document.getElementById("passwordInput");
    const authError = document.getElementById("authError");
    const authSuccess = document.getElementById("authSuccess");
    const userAvatar = document.getElementById("userAvatar");
    const userPseudo = document.getElementById("userPseudo");
    const infoPseudo = document.getElementById("infoPseudo");
    const infoPhone = document.getElementById("infoPhone");
    const infoDate = document.getElementById("infoDate");

    // BOUTON COMMENCER
    btnStart.addEventListener("click", () => {
      welcomeScreen.classList.remove("active");
      authScreen.classList.add("active");
    });

    // BASCULER ENTRE CONNEXION ET INSCRIPTION
    toggleAuth.addEventListener("click", () => {
      isLoginMode = !isLoginMode;
      if (isLoginMode) {
        authTitle.textContent = "Se connecter";
        authSubtitle.textContent = "Entre tes identifiants";
        btnAuth.textContent = "Se connecter";
        toggleAuth.innerHTML = 'Pas encore de compte ? <span>S\'inscrire</span>';
      } else {
        authTitle.textContent = "S'inscrire";
        authSubtitle.textContent = "Crée ton compte";
        btnAuth.textContent = "S'inscrire";
        toggleAuth.innerHTML = 'Déjà un compte ? <span>Se connecter</span>';
      }
      hideMessages();
    });

    // CONNEXION / INSCRIPTION AVEC FIREBASE
    btnAuth.addEventListener("click", async () => {
      const pseudo = pseudoInput.value.trim();
      const phone = phoneInput.value.trim();
      const password = passwordInput.value.trim();

      if (!pseudo || !phone || !password) {
        showError("Remplis tous les champs");
        return;
      }

      hideMessages();

      try {
        const userRef = ref(db, `users/${phone}`);

        if (isLoginMode) {
          // MODE CONNEXION : on lit dans la base de données
          const snapshot = await get(userRef);
          if (!snapshot.exists()) {
            showError("Ce numéro n'existe pas. Inscris-toi d'abord");
            return;
          }
          
          const userData = snapshot.val();
          if (userData.password !== password) {
            showError("Mot de passe incorrect");
            return;
          }
          
          currentUser = userData;
          showSuccess("Connexion réussie !");
          setTimeout(() => showAccountScreen(userData), 800);

        } else {
          // MODE INSCRIPTION : on ajoute dans la base de données
          const snapshot = await get(userRef);
          if (snapshot.exists()) {
            showError("Ce numéro est déjà utilisé");
            return;
          }
          
          const newUser = {
            pseudo: pseudo,
            phone: phone,
            password: password,
            created_at: Date.now()
          };
          
          await set(userRef, newUser);
          currentUser = newUser;
          showSuccess("Compte créé avec succès !");
          setTimeout(() => showAccountScreen(newUser), 800);
        }

      } catch (err) {
        showError("Erreur : " + err.message);
        console.error(err);
      }
    });

    // AFFICHER L'ÉCRAN COMPTE
    function showAccountScreen(userData) {
      authScreen.classList.remove("active");
      accountScreen.classList.add("active");
      
      userAvatar.textContent = userData.pseudo.charAt(0).toUpperCase();
      userPseudo.textContent = userData.pseudo;
      infoPseudo.textContent = userData.pseudo;
      infoPhone.textContent = userData.phone;
      
      const date = new Date(userData.created_at);
      infoDate.textContent = date.toLocaleDateString('fr-FR', { 
        day: '2-digit', 
        month: 'long', 
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
      
      // Vider les champs
      pseudoInput.value = "";
      phoneInput.value = "";
      passwordInput.value = "";
    }

    // DÉCONNEXION
    btnLogout.addEventListener("click", () => {
      accountScreen.classList.remove("active");
      welcomeScreen.classList.add("active");
      currentUser = null;
    });

    // Fonctions utilitaires
    function showError(msg) {
      authError.textContent = msg;
      authError.style.display = "block";
      authSuccess.style.display = "none";
    }

    function showSuccess(msg) {
      authSuccess.textContent = msg;
      authSuccess.style.display = "block";
      authError.style.display = "none";
    }

    function hideMessages() {
      authError.style.display = "none";
      authSuccess.style.display = "none";
    }

    // Permettre Entrée pour valider
    passwordInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") btnAuth.click();
    });
  </script>
</body>
</html>
