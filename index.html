<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Univers Chat</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial;background:#111b21;color:#e9edef;height:100vh;overflow:hidden}
    .screen{display:none;height:100vh;width:100%}
    .screen.active{display:flex}
    
    #welcomeScreen{justify-content:center;align-items:center;background:#0c1317;flex-direction:column;text-align:center}
    #welcomeScreen h1{font-size:32px;color:#25d366;margin-bottom:30px}
    #btnStart{padding:15px 40px;background:#25d366;border:none;border-radius:50px;font-weight:600;font-size:18px;color:#111b21;cursor:pointer}
    
    #authScreen{justify-content:center;align-items:center;background:#0c1317}
    .auth-box{background:#1f2c33;padding:40px 30px;border-radius:16px;width:90%;max-width:420px}
    .auth-box h2{color:#e9edef;margin-bottom:20px;font-size:26px;text-align:center}
    .auth-box input{width:100%;padding:14px;margin-bottom:15px;background:#2a3942;border:1px solid #374045;border-radius:10px;color:#e9edef;font-size:16px}
    .auth-box button{width:100%;padding:15px;background:#25d366;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:16px;margin-top:5px}
    .auth-box .toggle{margin-top:15px;text-align:center;color:#8696a0;font-size:14px}
    .auth-box .toggle span{color:#25d366;cursor:pointer;font-weight:600}
    .auth-box .error{color:#f15c6d;font-size:13px;margin-bottom:12px;text-align:center;display:none}
    .auth-box .success{color:#25d366;font-size:13px;margin-bottom:12px;text-align:center;display:none}
    
    #homeScreen{flex-direction:column;background:#111b21}
    .home-header{background:#1f2c33;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
    .home-header h1{font-size:22px;color:#25d366}
    .home-header button{padding:8px 14px;background:#dc3545;border:none;border-radius:8px;color:white;cursor:pointer;font-size:14px;font-weight:600}
    .home-content{flex:1;padding:30px}
    .home-content h3{color:#e9edef;margin-bottom:15px;font-size:20px}
    .home-content input{width:100%;padding:14px;margin-bottom:12px;background:#2a3942;border:1px solid #374045;border-radius:10px;color:#e9edef;font-size:16px}
    .home-content button{width:100%;padding:15px;background:#25d366;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:16px;margin-bottom:20px}
    .home-content .error{color:#f15c6d;font-size:13px;margin-bottom:10px;display:none}
    .user-info{background:#1f2c33;padding:20px;border-radius:12px;margin-bottom:25px;text-align:center}
    .user-info .avatar{width:60px;height:60px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111b21;font-size:28px;margin:0 auto 10px}
    .user-info h3{font-size:20px;color:#e9edef;margin-bottom:5px}
    .user-info p{font-size:14px;color:#8696a0}
    
    #chatScreen{flex-direction:column;background:#0b141a}
    .chat-header{background:#1f2c33;padding:12px 16px;display:flex;align-items:center;gap:12px}
    .chat-header button{background:none;border:none;color:#e9edef;font-size:22px;cursor:pointer;padding:5px}
    .chat-header h1{font-size:18px;color:#e9edef;flex:1}
    .messages{flex:1;padding:20px;overflow-y:auto}
    .messages-wrapper{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
    .message{background:#1f2c33;padding:8px 12px 22px 12px;border-radius:8px 8px 8px 2px;max-width:65%;position:relative;word-wrap:break-word}
    .message.moi{background:#005c4b;align-self:flex-end;border-radius:8px 8px 2px 8px}
    .message .pseudo{font-weight:600;color:#53bdeb;font-size:12px;margin-bottom:3px}
    .message-time{font-size:11px;color:#8696a0;position:absolute;bottom:5px;right:8px}
    .input-zone{padding:8px;background:#1f2c33}
    .input-container{max-width:800px;margin:0 auto;display:flex;gap:8px}
    #messageInput{flex:1;padding:12px;background:#2a3942;border:none;border-radius:8px;color:#e9edef;font-size:16px}
    #btnEnvoyer{padding:12px 18px;background:#25d366;border:none;border-radius:8px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div id="welcomeScreen" class="screen active">
    <h1>Bienvenue sur Univers Chat</h1>
    <button id="btnStart">Commencer</button>
  </div>

  <div id="authScreen" class="screen">
    <div class="auth-box">
      <h2 id="authTitle">Se connecter</h2>
      <div class="error" id="authError"></div>
      <div class="success" id="authSuccess"></div>
      <input type="text" id="pseudoInput" placeholder="Pseudo">
      <input type="tel" id="phoneInput" placeholder="Ton numéro de téléphone">
      <input type="password" id="passwordInput" placeholder="Mot de passe">
      <button id="btnAuth">Se connecter</button>
      <div class="toggle">
        <span id="toggleAuth">Pas encore de compte ? S'inscrire</span>
      </div>
    </div>
  </div>

  <div id="homeScreen" class="screen">
    <div class="home-header">
      <h1>Univers Chat</h1>
      <button id="btnLogout">Déconnexion</button>
    </div>
    <div class="home-content">
      <div class="user-info">
        <div class="avatar" id="userAvatar">U</div>
        <h3 id="userPseudo">Pseudo</h3>
        <p id="userPhone">Numéro</p>
      </div>
      
      <h3>Parler avec un ami</h3>
      <div class="error" id="chatError"></div>
      <input type="tel" id="friendPhoneInput" placeholder="Numéro de téléphone de ton ami">
      <button id="btnStartChat">Démarrer la conversation</button>
    </div>
  </div>

  <div id="chatScreen" class="screen">
    <div class="chat-header">
      <button id="btnRetour">←</button>
      <h1 id="chatContactName">Contact</h1>
    </div>
    <div class="messages" id="messages">
      <div class="messages-wrapper" id="messagesWrapper"></div>
    </div>
    <div class="input-zone">
      <div class="input-container">
        <input type="text" id="messageInput" placeholder="Écris un message" maxlength="500">
        <button id="btnEnvoyer">Envoyer</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onChildAdded, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDskOrlsXNEkcQlGO4jdC5LMPcWICEF04",
  authDomain: "univers-chat-a6303.firebaseapp.com",
  databaseURL: "https://univers-chat-a6303-default-rtdb.firebaseio.com",
  projectId: "univers-chat-a6303",
  storageBucket: "univers-chat-a6303.firebasestorage.app",
  messagingSenderId: "1019876595261",
  appId: "1:1019876595261:web:7c67c74bc1426b1ca2bc54"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let isLoginMode = true;
    let currentUser = null;
    let contactActuel = null;
    let ecouteurActuel = null;

    const welcomeScreen = document.getElementById("welcomeScreen");
    const authScreen = document.getElementById("authScreen");
    const homeScreen = document.getElementById("homeScreen");
    const chatScreen = document.getElementById("chatScreen");
    const btnStart = document.getElementById("btnStart");
    const btnAuth = document.getElementById("btnAuth");
    const btnLogout = document.getElementById("btnLogout");
    const btnStartChat = document.getElementById("btnStartChat");
    const btnRetour = document.getElementById("btnRetour");
    const btnEnvoyer = document.getElementById("btnEnvoyer");
    const toggleAuth = document.getElementById("toggleAuth");
    const authTitle = document.getElementById("authTitle");
    const pseudoInput = document.getElementById("pseudoInput");
    const phoneInput = document.getElementById("phoneInput");
    const passwordInput = document.getElementById("passwordInput");
    const friendPhoneInput = document.getElementById("friendPhoneInput");
    const messageInput = document.getElementById("messageInput");
    const messagesWrapper = document.getElementById("messagesWrapper");
    const chatContactName = document.getElementById("chatContactName");
    const authError = document.getElementById("authError");
    const authSuccess = document.getElementById("authSuccess");
    const chatError = document.getElementById("chatError");
    const userAvatar = document.getElementById("userAvatar");
    const userPseudo = document.getElementById("userPseudo");
    const userPhone = document.getElementById("userPhone");

    btnStart.addEventListener("click", () => {
      welcomeScreen.classList.remove("active");
      authScreen.classList.add("active");
    });

    toggleAuth.addEventListener("click", () => {
      isLoginMode = !isLoginMode;
      authTitle.textContent = isLoginMode ? "Se connecter" : "S'inscrire";
      btnAuth.textContent = isLoginMode ? "Se connecter" : "S'inscrire";
      toggleAuth.innerHTML = isLoginMode ? 'Pas encore de compte ? <span>S\'inscrire</span>' : 'Déjà un compte ? <span>Se connecter</span>';
      authError.style.display = "none";
      authSuccess.style.display = "none";
    });

    btnAuth.addEventListener("click", async () => {
      const pseudo = pseudoInput.value.trim();
      const phone = phoneInput.value.trim();
      const password = passwordInput.value.trim();

      if (!pseudo || !phone || !password) {
        showAuthError("Remplis tous les champs");
        return;
      }

      authError.style.display = "none";
      authSuccess.style.display = "none";

      try {
        const userRef = ref(db, `users/${phone}`);

        if (isLoginMode) {
          const snapshot = await get(userRef);
          if (!snapshot.exists()) {
            showAuthError("Ce numéro n'existe pas");
            return;
          }
          const userData = snapshot.val();
          if (userData.password !== password) {
            showAuthError("Mot de passe incorrect");
            return;
          }
          currentUser = userData;
          showSuccess("Connexion réussie !");
          setTimeout(() => showHomeScreen(userData), 800);

        } else {
          const snapshot = await get(userRef);
          if (snapshot.exists()) {
            showAuthError("Ce numéro est déjà utilisé");
            return;
          }
          const newUser = { pseudo, phone, password, created_at: Date.now() };
          await set(userRef, newUser);
          currentUser = newUser;
          showSuccess("Compte créé avec succès !");
          setTimeout(() => showHomeScreen(newUser), 800);
        }
      } catch (err) {
        showAuthError("Erreur : " + err.message);
        console.error(err);
      }
    });

    function showHomeScreen(userData) {
      authScreen.classList.remove("active");
      homeScreen.classList.add("active");
      userAvatar.textContent = userData.pseudo.charAt(0).toUpperCase();
      userPseudo.textContent = userData.pseudo;
      userPhone.textContent = userData.phone;
      pseudoInput.value = phoneInput.value = passwordInput.value = "";
    }

    btnLogout.addEventListener("click", () => {
      homeScreen.classList.remove("active");
      welcomeScreen.classList.add("active");
      currentUser = null;
      if (ecouteurActuel) ecouteurActuel.off();
    });

    btnStartChat.addEventListener("click", async () => {
      const friendPhone = friendPhoneInput.value.trim();
      
      if (!friendPhone) {
        showChatError("Tape le numéro de ton ami");
        return;
      }
      if (friendPhone === currentUser.phone) {
        showChatError("Tu ne peux pas discuter avec toi-même");
        return;
      }

      try {
        const friendRef = ref(db, `users/${friendPhone}`);
        const snapshot = await get(friendRef);
        
        if (!snapshot.exists()) {
          showChatError("Aucun utilisateur avec ce numéro");
          return;
        }
        
        contactActuel = snapshot.val();
        openChat(contactActuel);
        friendPhoneInput.value = "";
        chatError.style.display = "none";
        
      } catch (err) {
        showChatError("Erreur : " + err.message);
      }
    });

    function openChat(contact) {
      homeScreen.classList.remove("active");
      chatScreen.classList.add("active");
      chatContactName.textContent = contact.pseudo;
      chargerConversation(contact.pseudo);
    }

    btnRetour.addEventListener("click", () => {
      chatScreen.classList.remove("active");
      homeScreen.classList.add("active");
      messagesWrapper.innerHTML = "";
      if (ecouteurActuel) ecouteurActuel.off();
      contactActuel = null;
    });

    btnEnvoyer.addEventListener("click", envoyerMessage);
    messageInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") envoyerMessage();
    });

    async function envoyerMessage() {
      const texte = messageInput.value.trim();
      if (!texte || !contactActuel) return;
      
      const conversationId = [currentUser.pseudo, contactActuel.pseudo].sort().join("_");
      
      try {
        await push(ref(db, "messages"), {
          conversationId: conversationId,
          pseudo: currentUser.pseudo,
          phone: currentUser.phone,
          texte: texte,
          created_at: Date.now()
        });
        messageInput.value = "";
      } catch (err) {
        alert("Erreur envoi : " + err.message);
      }
    }

    function chargerConversation(contactPseudo) {
      const conversationId = [currentUser.pseudo, contactPseudo].sort().join("_");
      const messagesQuery = query(ref(db, "messages"), orderByChild("conversationId"), equalTo(conversationId));
      
      messagesWrapper.innerHTML = "";
      
      if (ecouteurActuel) ecouteurActuel.off();
      
      ecouteurActuel = onChildAdded(messagesQuery, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        const div = document.createElement("div");
        div.className = "message" + (data.pseudo === currentUser.pseudo ? " moi" : "");
        const date = new Date(data.created_at);
        const heure = `${date.getHours().toString().padStart(2,"0")}:${date.getMinutes().toString().padStart(2,"0")}`;
        div.innerHTML = `<div class="pseudo">${data.pseudo}</div><div>${data.texte}</div><span class="message-time">${heure}</span>`;
        messagesWrapper.appendChild(div);
        messagesWrapper.scrollTop = messagesWrapper.scrollHeight;
      });
    }

    function showAuthError(msg) {
      authError.textContent = msg;
      authError.style.display = "block";
      authSuccess.style.display = "none";
    }

    function showSuccess(msg) {
      authSuccess.textContent = msg;
      authSuccess.style.display = "block";
      authError.style.display = "none";
    }

    function showChatError(msg) {
      chatError.textContent = msg;
      chatError.style.display = "block";
    }

    passwordInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") btnAuth.click();
    });
  </script>
</body>
</html>
